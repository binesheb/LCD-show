name: Validate installer scripts

on:
  push:
    paths:
      - '**/*.sh'
      - '**/*-show'
      - 'rotate.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - '**/*.sh'
      - '**/*-show'
      - 'rotate.sh'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check shell syntax and executable bits
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
            if [[ ! -x "$script" ]]; then
              echo "ERROR: installer script is not executable: $script" >&2
              exit 1
            fi
          done < <(find . -type f \( -name '*.sh' -o -name '*-show' \) -print0)
