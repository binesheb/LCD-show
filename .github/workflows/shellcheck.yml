name: Validate installer scripts

on:
  push:
    paths:
      - '**/*.sh'
      - '**/*-show'
      - 'rotate.sh'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    paths:
      - '**/*.sh'
      - '**/*-show'
      - 'rotate.sh'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check shell syntax and installer executable bits
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done < <(find . -type f \( -name '*.sh' -o -name '*-show' \) -print0)

          while IFS= read -r -d '' script; do
            echo "Checking executable bit: $script"
            if [[ ! -x "$script" ]]; then
              echo "ERROR: top-level installer/helper is not executable: $script" >&2
              exit 1
            fi
          done < <(find . -maxdepth 1 -type f \( -name '*.sh' -o -name '*-show' \) -print0)

          while IFS= read -r -d '' script; do
            echo "Checking interpreter declaration: $script"
            if ! head -n 1 "$script" | grep -q '^#!'; then
              echo "ERROR: installer/helper has no shebang: $script" >&2
              exit 1
            fi
          done < <(find . -maxdepth 1 -type f \( -name '*.sh' -o -name '*-show' \) -print0)
